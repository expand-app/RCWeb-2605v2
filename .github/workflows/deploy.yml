name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy Environment"
        required: false
        default: "production"
        type: choice
        options:
          - production

# A publishing run must finish before the next one starts. Keep pending runs
# queued so an older manual dispatch cannot replace a newer main push.
concurrency:
  group: rexpand-production-oss
  queue: max
  cancel-in-progress: false

permissions:
  contents: write       # 'write' (not 'read') so the final "Notify deploy result"
                        # step can post commit comments when a push lands on main
                        # without a PR (webadmin Worker auto-commits). With
                        # 'read', commit-comment POST returns 403 and the
                        # workflow shows red even though OSS upload + CDN
                        # refresh already succeeded.
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard the approved site baseline
        run: python3 scripts/check_site_baseline.py

      - name: Verify traffic attribution
        run: node --test scripts/traffic-attribution.test.mjs

      - name: Install image optimizer
        run: |
          python3 -m venv /tmp/rexpand-image-venv
          /tmp/rexpand-image-venv/bin/pip install --disable-pip-version-check -r scripts/image-optimizer-requirements.txt

      - name: Stage deployable files
        run: |
          mkdir -p dist
          cp index.html dist/
          cp email.html dist/
          cp -r analytics dist/
          cp robots.txt dist/
          cp sitemap.xml dist/
          # Webmaster ownership files (Bing, Baidu, etc.) — served at root.
          if [ -f BingSiteAuth.xml ]; then cp BingSiteAuth.xml dist/; fi
          for f in baidu_verify_*.html google*.html; do
            [ -f "$f" ] && cp "$f" dist/
          done
          mkdir -p dist/media
          cp media/food.mp4 dist/media/
          cp media/food-*.png dist/media/
          cp media/meetfood-logo.png dist/media/
          cp -r media/team dist/media/
          cp -r media/avatars dist/media/
          # Per-page Open Graph thumbnails (/og/rexpand_*.png). Copy whatever is
          # in public/og/; harmless if empty.
          mkdir -p dist/og
          if compgen -G "public/og/*" >/dev/null; then cp -r public/og/. dist/og/; fi
          # Pre-render per-route static HTML so shared deep links get the right
          # title/description/og:image for crawlers that don't run JS (WeChat etc.)
          node scripts/og-pages.mjs
          /tmp/rexpand-image-venv/bin/python scripts/optimize-deploy-images.py dist
          /tmp/rexpand-image-venv/bin/python scripts/build-card-thumbnails.py dist
          echo "--- dist tree ---"
          find dist -maxdepth 3 -type f | sort
          du -sh dist

      - name: Set environment variables
        run: |
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "OSS_BUCKET=rexpand-official-website" >> $GITHUB_ENV

      - name: Refuse to publish an outdated main revision
        run: |
          set -euo pipefail
          latest_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$latest_main" ]]; then
            echo "::error::Could not determine the latest main revision."
            exit 1
          fi
          if [[ "$latest_main" != "$GITHUB_SHA" ]]; then
            echo "::error::main is now $latest_main; refusing to publish outdated revision $GITHUB_SHA."
            exit 1
          fi

      - name: Upload build to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ env.OSS_BUCKET }}
          OSS_ENDPOINT: "oss-cn-hangzhou.aliyuncs.com"
        run: |
          sudo -v ; curl https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil config -e $OSS_ENDPOINT -i $OSS_ACCESS_KEY_ID -k $OSS_ACCESS_KEY_SECRET
          ossutil cp -r -f ./dist/ oss://$OSS_BUCKET/
          # HTML shells (root index.html + every pre-rendered per-route *.html)
          # must always revalidate so a new deploy shows up immediately instead of
          # being served from a stale browser/CDN cache.
          ossutil cp -r -f --include "*.html" --meta "Cache-Control:no-cache" ./dist/ oss://$OSS_BUCKET/
          # sitemap.xml + llms.txt: explicit content-type so crawlers (and AI
          # crawlers checking /llms.txt) get text/plain or application/xml back
          # instead of OSS guessing application/octet-stream from extension.
          if [ -f dist/sitemap.xml ]; then
            ossutil cp -f --meta "Content-Type:application/xml; charset=utf-8#Cache-Control:no-cache" dist/sitemap.xml oss://$OSS_BUCKET/sitemap.xml
          fi
          if [ -f dist/llms.txt ]; then
            ossutil cp -f --meta "Content-Type:text/plain; charset=utf-8#Cache-Control:no-cache" dist/llms.txt oss://$OSS_BUCKET/llms.txt
          fi
          if [ -f dist/BingSiteAuth.xml ]; then
            ossutil cp -f --meta "Content-Type:application/xml; charset=utf-8#Cache-Control:no-cache" dist/BingSiteAuth.xml oss://$OSS_BUCKET/BingSiteAuth.xml
          fi
          # Baidu verification file is plain-text-with-hash but named .html
          # — Baidu's checker requires text/html content-type, not text/plain.
          for vf in dist/baidu_verify_*.html; do
            [ -f "$vf" ] && ossutil cp -f --meta "Content-Type:text/html; charset=utf-8#Cache-Control:no-cache" "$vf" "oss://$OSS_BUCKET/$(basename "$vf")"
          done
          # Publish every clean URL as an extensionless object. ESA Basic cannot
          # match the old DCDN regex host_redirect, so OSS needs an explicit
          # HTML Content-Type for objects without an extension.
          ossutil cp -r -f --meta "Content-Type:text/html; charset=utf-8#Cache-Control:no-cache" ./dist-clean-root/ "oss://$OSS_BUCKET/"
          ossutil cp -r -f --meta "Content-Type:text/html; charset=utf-8#Cache-Control:no-cache" ./dist-clean-nested/ "oss://$OSS_BUCKET/"
          # Keep the existing website fallback for unknown SPA paths. ESA
          # rewrites / to /index.html before OSS origin fetch.
          cat > /tmp/website.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <WebsiteConfiguration>
            <IndexDocument>
              <Suffix>index.html</Suffix>
              <SupportSubDir>false</SupportSubDir>
              <Type>0</Type>
            </IndexDocument>
            <ErrorDocument>
              <Key>index.html</Key>
              <HttpStatus>404</HttpStatus>
            </ErrorDocument>
          </WebsiteConfiguration>
          XML
          ossutil website --method put oss://$OSS_BUCKET /tmp/website.xml
          # Enable bucket versioning so accidental deletes/overwrites can be
          # rolled back. Idempotent. Not retroactive — only protects changes
          # made from now on. Re-run each deploy keeps it on (self-healing).
          ossutil bucket-versioning --method put oss://$OSS_BUCKET enabled || true

      - name: Refresh edge cache
        env:
          CDN_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          CDN_ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
          ESA_SITE_ID: ${{ vars.ESA_SITE_ID }}
        run: |
          cd $HOME
          curl -L -o aliyun-cli-linux-latest-amd64.tgz https://github.com/aliyun/aliyun-cli/releases/download/v3.0.226/aliyun-cli-linux-3.0.226-amd64.tgz
          tar xzvf aliyun-cli-linux-latest-amd64.tgz
          sudo cp aliyun /usr/local/bin
          sudo chmod +x /usr/local/bin/aliyun
          aliyun version

          aliyun configure set \
            --profile AkProfile \
            --mode AK \
            --access-key-id $CDN_ACCESS_KEY_ID \
            --access-key-secret $CDN_ACCESS_KEY_SECRET \
            --region cn-hangzhou

          if [[ -z "$ESA_SITE_ID" ]]; then
            echo "::error::ESA_SITE_ID repository variable is required for production cache refresh."
            exit 1
          fi
          aliyun esa PurgeCaches \
            --force --method POST --version 2024-09-10 \
            --endpoint esa.cn-hangzhou.aliyuncs.com \
            --SiteId "$ESA_SITE_ID" --Type directory \
            --Content '{"Directories":["https://www.rexpandcareer.com/","https://rexpandcareer.com/"]}'
          ossutil config -e oss-cn-hangzhou.aliyuncs.com -i "$CDN_ACCESS_KEY_ID" -k "$CDN_ACCESS_KEY_SECRET" >/dev/null 2>&1 || true
          ossutil rm -f "oss://${OSS_BUCKET}/_diag-hr.txt" || true

      - name: Notify deploy result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : status === 'cancelled' ? '⚠️' : '❌';
            const env = process.env.ENVIRONMENT || 'production';
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `${emoji} **Deploy ${status}** — \`${env}\``,
              '',
              `- Commit: \`${sha.substring(0, 7)}\``,
              `- Run: ${runUrl}`,
            ].join('\n');
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            if (prs.data.length === 0) {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
                body,
              });
              return;
            }
            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
